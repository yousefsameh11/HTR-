# HTR Project - Global configuration

project:
  name: "Handwritten Text Recognition System"
  dataset: "Teklia/IAM-line"
  device: "auto"  # auto | cuda | cpu
  seed: 42

paths:
  project_root: "."
  data_dir: "data"
  processed_dir: "data/processed"
  checkpoints_dir: "checkpoints"
  results_dir: "results"
  figures_dir: "experiments/figures"
  metrics_dir: "experiments/metrics"
  predictions_dir: "experiments/predictions"

data:
  image_column: "image"
  text_column: "text"
  train_split: "train"
  validation_split: "validation"
  test_split: "test"
  cache_processed: true
  max_train_samples: null        # set an integer for quick CPU smoke tests, e.g. 2000
  max_val_samples: null          # e.g. 400
  max_test_samples: null         # e.g. 400

# Shared image settings
image:
  grayscale: true
  normalize_mean: 0.5
  normalize_std: 0.5